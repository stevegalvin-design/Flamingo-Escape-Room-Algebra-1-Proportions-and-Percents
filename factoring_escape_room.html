x solid #94a3b8;border-radius:8px;font:700 1rem ui-monospace,monospace}.field input:focus,.code-input:focus{outline:3px solid #22d3ee88;border-color:#06b6d4}.field.narrow{flex:0 1 140px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hintbox{display:none;margin-top:12px;padding:12px;border:1px solid #475569;background:#1e293b;border-radius:9px;color:#e2e8f0}.hintbox.show{display:block}.hintbox p{margin:4px 0}.feedback{min-height:24px;margin-top:9px;font-weight:700}.feedback.good{color:#4ade80}.feedback.bad{color:#fca5a5}.room-actions{margin-top:22px;padding:20px;border:1px solid #334155;border-radius:14px;background:#111827}.locked-message{color:#cbd5e1;text-align:center}.code-panel{display:none}.code-panel.show{display:block}.code-panel h3{margin:0 0 4px;color:#67e8f9}.protocol{background:#0f172a;border:1px solid #334155;padding:12px;border-radius:9px;color:#e2e8f0}.code-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:12px}.code-entry{flex:1;min-width:170px}.completion{text-align:center}.completion h1{font-size:clamp(2.2rem,6vw,4rem);color:#67e8f9;margin:8px}.success-box{padding:16px;background:#064e3b;border:1px solid #34d399;border-radius:12px;margin:18px 0}.certificate{max-width:720px;margin:24px auto;padding:28px;border:5px double #67e8f9;background:#f8fafc;color:#0f172a;border-radius:8px}.certificate h2{letter-spacing:.13em;font-size:1.5rem}.certificate .cert-sub{color:#0369a1;font-weight:900;letter-spacing:.14em}.blank{display:inline-block;min-width:190px;border-bottom:1px solid #0f172a;height:1.4em;vertical-align:bottom}.certificate footer{font-weight:900;color:#047857;margin-top:22px}.completion-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.modal{display:none;position:fixed;inset:0;background:#020617cc;z-index:10;place-items:center;padding:18px}.modal.show{display:grid}.modal-card{max-width:460px;background:#1f2937;border:1px solid #64748b;border-radius:16px;padding:25px;text-align:center;box-shadow:0 20px 60px #0009}.modal-card h2{color:#fca5a5}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}.confetti i{position:absolute;top:-15px;width:9px;height:14px;animation:fall 3.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@keyframes pulse{to{box-shadow:0 0 14px #ef444477}}@media(max-width:650px){.topbar{gap:9px;flex-wrap:wrap}.brand{font-size:.75rem}.top-spacer{flex-basis:0}.stats{grid-template-columns:repeat(2,1fr)}.slots{gap:3px}.slot{width:22px;height:22px}.reset{padding:7px}}

<script>
'use strict';
const ROOMS=[
 {name:'The Sample Station',topic:'Factoring • Greatest Common Factor',scenario:'The sample storage unit is sealed. Factor out the GCF from each expression to generate the unlock sequence.',code:'6214',protocol:'Take the GCF coefficient from Problem 1, the exponent from Problem 2, the tens digit of the GCF coefficient from Problem 3, and the ones digit of the GCF coefficient from Problem 3.',type:'gcf',problems:[
  {type:'gcf',prompt:'Factor out the GCF.',expr:'18x³ + 24x² − 12x',answer:'6x(3x^2+4x-2)',hints:['Find the GCF of 18, 24, and 12. Then find the lowest power of x.','GCF of coefficients is 6. Lowest power of x is x¹. Factor out 6x.']},
  {type:'gcf',prompt:'Factor out the GCF.',expr:'−35x⁴ + 70x³ + 105x²',answer:'-35x^2(x^2-2x-3)',hints:['The GCF of 35, 70, and 105 is 35. The leading coefficient is negative — factor out −35.','Factor out −35x². Check: −35x²(x²−2x−3).']},
  {type:'gcf',prompt:'Factor out the GCF.',expr:'42x³ − 56x² + 14x − 28',answer:'14(3x^3-4x^2+x-2)',hints:['Find the GCF of 42, 56, 14, and 28. There is no variable in the GCF.','GCF is 14. Factor out 14 from all four terms.']}
 ]},
 {name:'The Reaction Chamber',topic:'Factoring • Trinomials (a = 1)',scenario:'The reaction chamber is locked. Factor each trinomial to restore the chemical feed.',code:'1218',protocol:'Take the ones digit of the larger factor from Problem 1, the ones digit of the larger factor from Problem 2, the tens digit of the larger factor from Problem 3, and the ones digit of the smaller factor from Problem 3.',type:'pair',problems:[
  {type:'pair',prompt:'Factor the trinomial completely.',expr:'x² + 19x + 88',f1:'(x+8)',f2:'(x+11)',hints:['Find two numbers that multiply to 88 and add to 19.','8 × 11 = 88 and 8 + 11 = 19.']},
  {type:'pair',prompt:'Factor the trinomial completely.',expr:'x² − 23x + 132',f1:'(x-11)',f2:'(x-12)',hints:['Find two numbers that multiply to 132 and add to −23. Both must be negative.','−11 × −12 = 132 and −11 + −12 = −23.']},
  {type:'pair',prompt:'Factor the trinomial completely.',expr:'x² + 7x − 120',f1:'(x+15)',f2:'(x-8)',hints:['Find two numbers that multiply to −120 and add to 7. One is positive, one is negative.','15 × −8 = −120 and 15 + (−8) = 7.']}
 ]},
 {name:'The Microscope Bay',topic:'Factoring • Trinomials (a ≠ 1)',scenario:'The microscope bay is offline. Factor each trinomial to restore the imaging system.',code:'4334',protocol:'Take the larger constant from Problem 1, the larger constant from Problem 2, the smaller constant from Problem 3, and the larger constant from Problem 3.',type:'pair',problems:[
  {type:'pair',prompt:'Factor the trinomial completely.',expr:'6x² + 11x + 4',f1:'(2x+1)',f2:'(3x+4)',hints:['Use the AC method: multiply a × c = 6 × 4 = 24. Find two numbers that multiply to 24 and add to 11.','The numbers are 3 and 8. Rewrite as 6x² + 3x + 8x + 4, then factor by grouping.']},
  {type:'pair',prompt:'Factor the trinomial completely.',expr:'10x² − 11x + 3',f1:'(2x-1)',f2:'(5x-3)',hints:['AC method: a × c = 10 × 3 = 30. Find two numbers that multiply to 30 and add to −11.','The numbers are −5 and −6. Rewrite as 10x² − 5x − 6x + 3, then factor by grouping.']},
  {type:'pair',prompt:'Factor the trinomial completely.',expr:'6x² + x − 12',f1:'(2x+3)',f2:'(3x-4)',hints:['AC method: a × c = 6 × (−12) = −72. Find two numbers that multiply to −72 and add to 1.','The numbers are 9 and −8. Rewrite as 6x² + 9x − 8x − 12, then factor by grouping.']}
 ]},
 {name:'The Magnetic Field Lab',topic:'Factoring • Difference of Squares',scenario:'The magnetic containment field has failed. Factor each difference of squares to restore the field.',code:'7894',protocol:'Take the coefficient of x from Problem 1, the constant from Problem 2, the coefficient of x from Problem 3, and the constant from Problem 3.',type:'pair',problems:[
  {type:'pair',prompt:'Factor the expression completely.',expr:'49x² − 121',f1:'(7x+11)',f2:'(7x-11)',hints:['Write 49x² as (7x)² and 121 as 11². Apply the difference of squares pattern: a² − b² = (a+b)(a−b).','a = 7x, b = 11. So the factored form is (7x+11)(7x−11).']},
  {type:'pair',prompt:'Factor the expression completely.',expr:'25x² − 64',f1:'(5x+8)',f2:'(5x-8)',hints:['Write 25x² as (5x)² and 64 as 8². Apply the difference of squares pattern.','a = 5x, b = 8. So the factored form is (5x+8)(5x−8).']},
  {type:'pair',prompt:'Factor the expression completely.',expr:'81x² − 16',f1:'(9x+4)',f2:'(9x-4)',hints:['Write 81x² as (9x)² and 16 as 4². Apply the difference of squares pattern.','a = 9x, b = 4. So the factored form is (9x+4)(9x−4).']}
 ]},
 {name:'The Culture Room',topic:'Factoring • GCF then Trinomial',scenario:'The culture samples are locked in. Factor out the GCF first, then factor the remaining quadratic.',code:'6548',protocol:'Take the GCF coefficient from Problem 1, the GCF coefficient from Problem 2, the larger constant from Problem 2, and the GCF coefficient from Problem 3.',type:'gcfpair',problems:[
  {type:'gcfpair',prompt:'Factor completely.',expr:'6x³ + 114x² + 528x',gcf:'6x',f1:'(x+8)',f2:'(x+11)',hints:['First factor out the GCF from 6x³ + 114x² + 528x. The GCF is 6x.','After factoring out 6x, you get 6x(x² + 19x + 88). Now factor the trinomial.']},
  {type:'gcfpair',prompt:'Factor completely.',expr:'10x³ − 35x² − 20x',gcf:'5x',f1:'(2x+1)',f2:'(x-4)',hints:['First factor out the GCF from 10x³ − 35x² − 20x. The GCF is 5x.','After factoring out 5x, you get 5x(2x² − 7x − 4). Now factor the trinomial using the AC method.']},
  {type:'gcfpair',prompt:'Factor completely.',expr:'8x⁴ − 200x²',gcf:'8x^2',f1:'(x+5)',f2:'(x-5)',hints:['First factor out the GCF from 8x⁴ − 200x². The GCF is 8x².','After factoring out 8x², you get 8x²(x² − 25). Now factor the difference of squares.']}
 ]},
 {name:'The Power Core',topic:'Factoring • Perfect Square Trinomials',scenario:'The power core is the final lock. Factor each perfect square trinomial to restore full power.',code:'7615',protocol:'Take the constant from Problem 1, the coefficient of x inside the binomial from Problem 2, the ones digit of the constant from Problem 2, and the constant from Problem 3.',type:'perfect',problems:[
  {type:'perfect',prompt:'Factor the perfect square trinomial completely.',expr:'25x² + 70x + 49',binomial:'5x+7',outer:null,hints:['Check: is the first term a perfect square? Is the last term a perfect square? Is the middle term twice the product of their square roots?','√(25x²) = 5x and √49 = 7. Middle term check: 2(5x)(7) = 70x ✓. Factored form: (5x+7)².']},
  {type:'perfect',prompt:'Factor the perfect square trinomial completely.',expr:'36x² − 132x + 121',binomial:'6x-11',outer:null,hints:['√(36x²) = 6x and √121 = 11. Check the middle term: 2(6x)(11) = 132x ✓. The sign in the binomial matches the sign of the middle term.','Factored form: (6x−11)².']},
  {type:'perfect',prompt:'Factor the perfect square trinomial completely.',expr:'48x² − 120x + 75',binomial:'4x-5',outer:'3',hints:['First check for a GCF. GCF of 48, 120, and 75 is 3. Factor out 3 first.','After factoring out 3: 3(16x² − 40x + 25). Now check: √(16x²) = 4x, √25 = 5, 2(4x)(5) = 40x ✓. Factored form: 3(4x−5)².']}
 ]}
];
let timerId=null,secondsLeft=2700,currentRoom=0,solved=new Set(),hintCounts={},timeModalShown=false;
const $=s=>document.querySelector(s), roomContent=$('#roomContent'),timer=$('#timer');
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$('#'+id).classList.add('active')}
function renderStart(){showScreen('startScreen');$('#startScreen').innerHTML=`<div class="card hero"><div class="shield" aria-hidden="true">🛡️</div><p class="eyebrow">Emergency Containment Protocol • Authorization Required</p><h1>The Factoring Lab Is Locked</h1><p class="subtitle">Algebra 2 Factoring Quadratic Expressions Digital Escape Room</p><div class="stats"><div class="stat"><strong>6</strong><span>sealed lab stations</span></div><div class="stat"><strong>18</strong><span>factoring challenges</span></div><div class="stat"><strong>45:00</strong><span>until emergency override</span></div><div class="stat"><strong>4 digits</strong><span>per station access code</span></div></div><div class="objective"><strong>MISSION OBJECTIVE</strong><br>A contamination event has triggered emergency lockdown. You are the lab technicians. Factor the expressions at each sealed station, follow the Code Protocol to extract answer digits, and restore the facility before time runs out.</div><button id="startBtn" class="btn" type="button">Begin Emergency Protocol</button></div>`;$('#startBtn').addEventListener('click',startGame)}
function startGame(){clearInterval(timerId);secondsLeft=2700;timeModalShown=false;solved.clear();hintCounts={};document.querySelectorAll('.slot').forEach(s=>s.classList.remove('done'));updateTimer();loadRoom(0);timerId=setInterval(tick,1000)}
function tick(){if(secondsLeft>0){secondsLeft--;updateTimer()}if(secondsLeft<=0&&!timeModalShown){clearInterval(timerId);timeModalShown=true;$('#timeModal').classList.add('show')}}
function updateTimer(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;timer.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');timer.classList.toggle('warning',secondsLeft<=600&&secondsLeft>180);timer.classList.toggle('danger',secondsLeft<=180)}
function normExpr(s){return String(s).replace(/\s+/g,'').replace(/\u2212/g,'-').replace(/\u00b9/g,'^1').replace(/\u00b2/g,'^2').replace(/\u00b3/g,'^3').replace(/\u2074/g,'^4').replace(/\u2075/g,'^5').replace(/\u2076/g,'^6').replace(/\u2077/g,'^7').replace(/\u2078/g,'^8').replace(/\u2079/g,'^9').toLowerCase()}
function checkFactoredPair(student,f1,f2){const s=normExpr(student),a=normExpr(f1),b=normExpr(f2);return s===a+b||s===b+a}
function checkPerfectSquare(student,binomial,outerFactor){const s=normExpr(student),b=normExpr(binomial);if(outerFactor)return s===outerFactor+'('+b+')^2'||s===outerFactor+'('+b+')('+b+')';return s==='('+b+')^2'||s==='('+b+')('+b+')'}
function problemFields(room,p,i){const pid=`p${i}`;return `<div class="fields"><div class="field"><label for="${pid}answer">Factored form</label><input type="text" id="${pid}answer" autocomplete="off" placeholder="Type the complete factored expression"></div></div>`}
function checkAnswer(s,p){if(p.type==='gcf'){return s===normExpr(p.answer)}if(p.type==='pair'){return checkFactoredPair(s,p.f1,p.f2)}if(p.type==='gcfpair'){const gcf=normExpr(p.gcf);const a=normExpr(p.f1),b=normExpr(p.f2);return s===gcf+a+b||s===gcf+b+a}if(p.type==='perfect'){return checkPerfectSquare(s,p.binomial,p.outer)}return false}
function loadRoom(index){if(index>=ROOMS.length){renderCompletion();return}currentRoom=index;const room=ROOMS[index];solved=new Set();showScreen('roomScreen');roomContent.innerHTML=`<div class="room-head"><div class="room-line"><span class="badge">STATION ${index+1} / 6</span><span class="eyebrow">${room.topic}</span></div><h2>${room.name}</h2><p>${room.scenario}</p></div><div class="instruction"><strong>Input format:</strong> Use ^ for exponents and parentheses. Example: 6x(3x^2+4x-2) or (x+8)(x+11)</div><div id="problems">${room.problems.map((p,i)=>`<article class="problem" data-pid="p${i}"><div class="problem-head"><span>Problem ${i+1}</span><span class="status" id="status-p${i}">UNSOLVED</span></div><p class="prompt">${p.prompt}</p><div class="equation">${p.expr}</div>${problemFields(room,p,i)}<div class="actions"><button type="button" class="btn small checkBtn" data-pid="p${i}">Check Answer</button><button type="button" class="btn small secondary hintBtn" data-pid="p${i}">Show Hint</button></div><div class="hintbox" id="hint-p${i}" aria-live="polite"></div><div class="feedback" id="feedback-p${i}" aria-live="polite"></div></article>`).join('')}</div><div class="room-actions"><div id="lockedMessage" class="locked-message">🔒 Access protocol locked — solve all three problems to reveal the station code protocol.</div><div id="codePanel" class="code-panel"><h3>Station Code Protocol</h3><p class="protocol">${room.protocol}</p><div class="code-row"><div class="code-entry"><div class="field"><label for="roomCode">4-digit station access code</label><input type="text" id="roomCode" autocomplete="off" placeholder="Enter code"></div></div><button id="unlockBtn" type="button" class="btn success">Unlock Station</button></div><div id="codeFeedback" class="feedback" aria-live="polite"></div></div></div>`;
roomContent.querySelectorAll('.checkBtn').forEach(btn=>btn.addEventListener('click',()=>checkProblem(btn.dataset.pid)));roomContent.querySelectorAll('.hintBtn').forEach(btn=>btn.addEventListener('click',()=>showHint(btn.dataset.pid)));roomContent.querySelector('#unlockBtn').addEventListener('click',()=>unlockRoom(index));roomContent.querySelector('#roomCode').addEventListener('keydown',e=>{if(e.key==='Enter')unlockRoom(index)});roomContent.querySelectorAll('.problem input').forEach(input=>input.addEventListener('keydown',e=>{if(e.key==='Enter')checkProblem(input.closest('.problem').dataset.pid)}))}
function checkProblem(pid){const i=Number(pid.split('p')[1]);const room=ROOMS[currentRoom];const p=room.problems[i];const box=roomContent.querySelector(`[data-pid="${pid}"]`);const input=box.querySelector('#'+pid+'answer');const ok=checkAnswer(normExpr(input.value),p);const feedback=box.querySelector('#feedback-'+pid);const status=box.querySelector('#status-'+pid);if(ok){solved.add(i);feedback.textContent='Correct — station data accepted.';feedback.className='feedback good';status.textContent='SOLVED';status.classList.add('solved');box.querySelectorAll('input').forEach(el=>el.disabled=true);box.querySelectorAll('button').forEach(el=>el.disabled=true);if(solved.size===3){roomContent.querySelector('#lockedMessage').hidden=true;roomContent.querySelector('#codePanel').classList.add('show');roomContent.querySelector('#roomCode').focus()}}else{feedback.textContent='Not quite yet. Recheck your factoring and try again.';feedback.className='feedback bad'}}
function showHint(pid){const i=Number(pid.split('p')[1]),p=ROOMS[currentRoom].problems[i],hint=roomContent.querySelector('#hint-'+pid);hintCounts[pid]=(hintCounts[pid]||0)+1;const n=Math.min(hintCounts[pid],p.hints.length)-1;hint.innerHTML=`<p><strong>Hint ${n+1}:</strong> ${p.hints[n]}</p>`;hint.classList.add('show')}
function unlockRoom(index){const input=roomContent.querySelector('#roomCode'),feedback=roomContent.querySelector('#codeFeedback');if(input.value.trim()===ROOMS[index].code){feedback.textContent='Access code accepted. Station restored.';feedback.className='feedback good';document.querySelector(`.slot[data-slot="${index}"]`).classList.add('done');setTimeout(()=>index<ROOMS.length-1?loadRoom(index+1):renderCompletion(),450)}else{feedback.textContent='Access code rejected. Revisit the Code Protocol and check each extracted digit.';feedback.className='feedback bad';input.select()}}
function renderCompletion(){clearInterval(timerId);showScreen('completionScreen');$('#completionScreen').innerHTML=`<div class="card completion"><p class="eyebrow">Emergency Override Complete</p><h1>LOCKDOWN LIFTED</h1><p class="subtitle">All six lab stations have been restored. The contamination event has been contained.</p><div class="success-box">You successfully demonstrated mastery of GCF factoring, trinomial factoring (a=1 and a≠1), difference of squares, multi-step factoring, and perfect square trinomials.</div><div class="certificate"><p class="cert-sub">LAB CLEARANCE CERTIFICATE</p><h2>Factoring Quadratic Expressions</h2><p>This certifies that <span class="blank" aria-label="blank for student name"></span> successfully completed all six lab stations in the Algebra 2 Factoring Quadratic Expressions Digital Escape Room.</p><footer>Mathematical Lab Clearance: GRANTED</footer></div><div class="completion-actions"><button id="printBtn" class="btn" type="button">Print Certificate</button><button id="playAgainBtn" class="btn secondary" type="button">Play Again</button></div></div>`;launchConfetti();$('#printBtn').addEventListener('click',()=>window.print());$('#playAgainBtn').addEventListener('click',()=>{clearConfetti();renderStart()})}
function launchConfetti(){const c=$('#confetti'),colors=['#06b6d4','#2563eb','#22c55e','#f59e0b','#e879f9'];c.innerHTML='';for(let i=0;i<90;i++){const bit=document.createElement('i');bit.style.left=Math.random()*100+'%';bit.style.background=colors[i%colors.length];bit.style.animationDelay=Math.random()*1.5+'s';bit.style.transform=`rotate(${Math.random()*360}deg)`;c.appendChild(bit)}setTimeout(clearConfetti,5000)}function clearConfetti(){$('#confetti').innerHTML=''}
function resetGame(){if(!confirm('Reset the escape room? All progress and the timer will be cleared.'))return;clearInterval(timerId);timerId=null;secondsLeft=2700;timeModalShown=false;solved.clear();hintCounts={};$('#timeModal').classList.remove('show');document.querySelectorAll('.slot').forEach(s=>s.classList.remove('done'));updateTimer();renderStart()}
// Static controls are wired directly here; the Start control is wired after injection in renderStart().
$('#resetBtn').addEventListener('click',resetGame);$('#continueBtn').addEventListener('click',()=>$('#timeModal').classList.remove('show'));renderStart();updateTimer();
</script>
</body></html>
